name: Build private IPTVstream TV handoff
on:
  push:
    branches: ['play/tv-unsigned-handoff']
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cmdline="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$cmdline"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          yes | "$cmdline" --sdk_root="$sdk" --licenses >/dev/null || true
          "$cmdline" --sdk_root="$sdk" --install "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned Google Play TV bundle
        run: |
          set -euo pipefail
          python3 - <<'PYBUILD'
          from pathlib import Path
          p = Path("tv/build.gradle.kts")
          s = p.read_text()
          old = 'signingConfigs.getByName("debug")'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'null'))
          PYBUILD
          ./gradlew --no-daemon -Pdistribution=play :tv:bundleRelease
          test -s tv/build/outputs/bundle/release/tv-release.aab
          if unzip -Z1 tv/build/outputs/bundle/release/tv-release.aab | grep -Ei '^META-INF/.*\.(RSA|SF|DSA|EC)$'; then
            echo "Bundle unexpectedly signed"
            exit 1
          fi
