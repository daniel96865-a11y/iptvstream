name: Validate IPTVstream TV Play build
on:
  push:
    branches: ['play/tv-buffer-1.0.78']
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cmdline="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$cmdline"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          yes | "$cmdline" --sdk_root="$sdk" --licenses >/dev/null || true
          "$cmdline" --sdk_root="$sdk" --install "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Play-specific tests and lint
        run: ./gradlew --no-daemon -Pdistribution=play :core:testDebugUnitTest :tv:testDebugUnitTest :tv:lintDebug
      - name: Validate Android App Bundle build (no release credentials)
        run: |
          ./gradlew --no-daemon -Pdistribution=play :tv:bundleRelease
          test -s tv/build/outputs/bundle/release/tv-release.aab
