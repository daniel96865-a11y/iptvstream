name: TV buffer preview
on:
  push:
    branches: ['preview/tv-buffer-1.0.78']
permissions:
  contents: read
concurrency:
  group: tv-buffer-preview-1.0.78
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cmdline="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$cmdline"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$cmdline" --sdk_root="$sdk" --licenses >/dev/null || true
          "$cmdline" --sdk_root="$sdk" --install "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon :core:testDebugUnitTest :tv:testDebugUnitTest
      - name: Sign and build TV APK
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew --no-daemon :tv:assembleRelease
      - name: Verify TV APK and the existing GitHub release certificate
        run: |
          set -euo pipefail
          mkdir dist
          cp tv/build/outputs/apk/release/tv-release.apk dist/iptvstream-tv-1.0.78-buffer1.apk
          curl --fail --silent --show-error --location https://github.com/daniel96865-a11y/iptvstream/releases/download/v1.0.77/iptvstream-tv.apk -o "$RUNNER_TEMP/stable.apk"
          signer() {
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$1" |
              awk -F': ' '/certificate SHA-256 digest/ { print $2 }'
          }
          expected="$(signer "$RUNNER_TEMP/stable.apk")"
          actual="$(signer dist/iptvstream-tv-1.0.78-buffer1.apk)"
          test -n "$expected"
          test "$expected" = "$actual"
          cd dist
          sha256sum iptvstream-tv-1.0.78-buffer1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iptvstream-tv-buffer1
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iptvstream-tv-buffer1
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.78-buffer1
          target_commitish: ${{ github.sha }}
          name: IPTVstream TV 1.0.78-buffer1 (Testversion)
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/iptvstream-tv-1.0.78-buffer1.apk
            dist/SHA256SUMS.txt
          body: |
            Nur für Android TV / Fire TV. Testversion auf Basis von 1.0.77.
            Beim Puffern verbindet der Player erst neu, wenn der Puffer nicht mehr wächst.
            Bei einem echten Streamende wird der Restpuffer länger abgespielt.
            HLS- und DASH-Segmentabschlüsse lösen keinen erzwungenen Neustart aus.
            Die stabile Version, automatische Updates und Google Play bleiben unverändert.
